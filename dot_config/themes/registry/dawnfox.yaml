name: dawnfox
mode: light
description: "Dawnfox - rose-tinted light"

colors:
  background:    "#faf4ed"
  foreground:    "#575279"
  cursor:        "#1f2328"
  selection_bg:  "#d0d8d8"
  selection_fg:  "#575279"
  black:         "#575279"
  red:           "#b4637a"
  green:         "#618774"
  yellow:        "#ea9d34"
  blue:          "#286983"
  magenta:       "#907aa9"
  cyan:          "#56949f"
  white:         "#e5e9f0"
  bright_black:  "#5f5695"
  bright_red:    "#c26d85"
  bright_green:  "#629f81"
  bright_yellow: "#eea846"
  bright_blue:   "#2d81a3"
  bright_magenta: "#9a80b9"
  bright_cyan:   "#5ca7b4"
  bright_white:  "#e6ebf3"

terminal:
  wezterm_scheme: "dawnfox"
  ghostty_uses_palette: true

tmux:
  default_bg:           "#ebe5df"
  default_fg:           "#625c87"
  active_pane_border:   "#286983"
  inactive_pane_border: "#a8a3b3"
  left1_bg:             "#286983"
  left1_fg:             "#ebe5df"
  copy_mode_bg:         "#286983"
  copy_mode_fg:         "#ebe5df"
  window_curr_bg:       "#f4a261"
  window_curr_fg:       "#ebe5df"
  window_bg:            "#f8e0ca"
  window_fg:            "#f4a261"
  sync_color:           "#c94f6d"
  prefix_indicator:     "#81b29a"
  right1_bg:            "#286983"
  right1_fg:            "#ebe5df"
  right2_bg:            "#a8a3b3"
  right2_fg:            "#286983"

fzf:
  bg:        "#faf4ed"
  bg_plus:   "#c8d4d4"
  fg:        "#575279"
  fg_plus:   "#575279"
  hl:        "#56949f"
  hl_plus:   "#eea846"
  border:    "#286983"
  gutter:    "#faf4ed"
  header:    "#618774"
  info:      "#575279"
  label:     "#575279"
  marker:    "#b4637a"
  pointer:   "#b4637a"
  prompt:    "#907aa9"
  query_fg:  "#575279"
  scrollbar: "#286983"
  separator: "#ea9d34"
  spinner:   "#b4637a"

delta:
  section_name:                  "dawnfox"
  minus_style:                   'syntax "#f0ddd7"'
  minus_non_emph_style:          'syntax "#f0ddd7"'
  minus_emph_style:              'syntax "#d9a0a8"'
  minus_empty_line_marker_style: 'syntax "#f0ddd7"'
  line_numbers_minus_style:      '"#b4637a"'
  plus_style:                    'syntax "#d8e8e0"'
  plus_non_emph_style:           'syntax "#d8e8e0"'
  plus_emph_style:               'syntax "#a0c8b0"'
  plus_empty_line_marker_style:  'syntax "#d8e8e0"'
  line_numbers_plus_style:       '"#618774"'
  line_numbers_zero_style:       '"#9893a5"'

lazygit:
  active_border_color:         ["#ea9d34", "bold"]
  inactive_border_color:       ["#286983"]
  searching_active_border:     ["#ea9d34", "bold"]
  options_text_color:          ["#286983"]
  selected_line_bg_color:      ["#d0d8d8"]
  cherry_picked_commit_fg:     ["#286983"]
  cherry_picked_commit_bg:     ["#907aa9"]
  marked_base_commit_fg:       ["#618774"]
  marked_base_commit_bg:       ["#ea9d34"]
  unstaged_changes_color:      ["#b4637a"]
  default_fg_color:            ["#575279"]
